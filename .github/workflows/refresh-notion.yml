name: Refresh Notion content

on:
  schedule:
    - cron: '17 7 * * *' # Daily at 07:17 UTC (08:17/09:17 Europe/Madrid).
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notion-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify refresh safeguards
        run: python -m unittest discover -s tests -v
      - name: Retrieve and validate content
        run: python scripts/refresh_notion.py
      - name: Commit changed snapshot
        shell: bash
        run: |
          git add data/notion
          if git diff --cached --quiet; then
            echo 'No content changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh Notion content snapshot'
          git push origin HEAD
